<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="FundsLink Academy">
  <title>FundsLink Academy</title>
  <desc>The Rising Door weighted for 16–40 px (tabs, favicons): a heavier doorway and no tread highlights. Adapts to dark mode.</desc>
  <defs>
    <linearGradient id="fls-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fls-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.55" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <path class="door" d="M4.5 21V10a7.5 7.5 0 0 1 15 0v11" stroke="#1b2c4d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7.2 21v-2.5h3v-2.5h3v-2.5h3.4v7.5z" fill="url(#fls-silver)" stroke="url(#fls-silver)" stroke-width="0.9" stroke-linejoin="round"/>
  <g transform="translate(8.94 5.08) scale(0.38)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" fill="url(#fls-gold)" stroke="url(#fls-gold)" stroke-width="1.3"/>
    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" fill="#d97706" stroke="#d97706" stroke-width="1.3"/>
    <path d="M22 10v6" stroke="#b45309" stroke-width="2.2"/>
  </g>
  <style>@media (prefers-color-scheme: dark) { .door { stroke: #f1f5f9; } }</style>
</svg>
