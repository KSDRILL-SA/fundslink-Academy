<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FundsLink Academy — Ascending">
  <title>FundsLink Academy — Ascending</title>
  <desc>Three ascending bars (growth, the climb) cresting in a gold summit with a spark — the goal reached.</desc>
  <!-- Navy steps: the climb -->
  <rect x="11" y="40" width="11" height="14" rx="2.5" fill="#1b2c4d"/>
  <rect x="26.5" y="30" width="11" height="24" rx="2.5" fill="#1b2c4d"/>
  <!-- Gold summit + spark: the goal reached -->
  <rect x="42" y="20" width="11" height="34" rx="2.5" fill="#f59e0b"/>
  <circle cx="47.5" cy="12" r="4" fill="#f59e0b"/>
</svg>
