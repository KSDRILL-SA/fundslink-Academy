openapi: 3.1.0
info:
  title: FundsLink Academy API
  version: "1.1.0"
  description: >
    Contract-first API (S2.7) for FundsLink v1 — locked WITH ERD-PACKAGE v1.0.
    Governed by the master-spec, technical-architecture, and database doctrine.
    FastAPI's generated schema is CI-diffed against this file; drift fails the build.
  contact: { name: "Maluleke Kurhula Success — Founder, KSDRILL SA" }
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      operationId: authRegister
      security: []
      summary: Register a new student account (consent recorded — MASTER-SPEC §15.4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/login:
    post:
      operationId: authLogin
      security: []
      summary: Login (rate-limited; lockout per TAD §3.1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      operationId: authRefresh
      security: []
      summary: Rotate refresh token (family revocation on reuse)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke session (deny-list jti)
      responses:
        '204': { description: Logged out }

  /auth/mfa:
    get:
      operationId: authMfaStatus
      summary: Is two-step sign-in on for my account, and how many recovery codes are left
      description: >-
        Also answers during the MFA step-up session (the short-lived token a privileged account
        receives on its first sign-in, before enrolment), so the account screen can show the
        enrolment step rather than an error.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MfaStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/mfa/disable:
    post:
      operationId: authMfaDisable
      summary: Turn two-step sign-in off — password AND a current code; never for a privileged role
      description: >-
        Weakening an account needs both factors, so a stolen session alone cannot strip the second
        one. The code may be an authenticator code or one recovery code. MFA is mandatory for
        privileged roles (TAD §3.1), so those accounts are refused with `mfa_required_for_role`.
        The TOTP secret and the recovery codes are cleared, not just the flag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaSensitiveRequest' }
      responses:
        '204': { description: Two-step sign-in turned off }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /auth/mfa/recovery-codes:
    post:
      operationId: authMfaRegenerateRecoveryCodes
      summary: Replace the recovery codes — password AND a current code; shown once
      description: >-
        Returns a fresh set and invalidates every previous code immediately. The response is the
        only time they are readable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaSensitiveRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MfaRecoveryCodes' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /auth/mfa/enroll:
    post:
      operationId: authMfaEnroll
      summary: Begin TOTP MFA enrolment — returns provisioning URI + recovery codes (shown once)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/activate:
    post:
      operationId: authMfaActivate
      summary: Activate MFA by confirming a TOTP code (mandatory for privileged roles — TAD §3.1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaActivateRequest' }
      responses:
        '204': { description: MFA activated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/verify-email:
    post:
      operationId: authVerifyEmail
      security: []
      summary: Verify an email address with a single-use token (S3.12)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/Validation' }
  /auth/verify-email/resend:
    post:
      operationId: authResendVerification
      security: []
      summary: Resend the verification email (enumeration-proof — always 202)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Accepted }
  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      security: []
      summary: Request a password reset — always 202, enumeration-proof (S3.30)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { description: Accepted }
  /auth/reset-password:
    post:
      operationId: authResetPassword
      security: []
      summary: Reset password with a single-use token; revokes all sessions (S3.30 / S3.35)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204': { description: Password reset }
        '400': { $ref: '#/components/responses/Validation' }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/change-password:
    post:
      operationId: authChangePassword
      summary: Change password (authenticated); revokes all sessions (S3.35)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }

  /students/me/profile:
    get:
      operationId: getMyProfile
      summary: Get my student profile
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudentProfile' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putMyProfile
      summary: Create/update my profile (re-embeds on change — BR-M04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentProfileInput' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudentProfile' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /students/me/documents:
    post:
      operationId: uploadDocument
      summary: Upload a document (magic-byte validated, AV-scanned — ST-2.4)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [doc_type, file]
              properties:
                doc_type: { type: string }
                application_id: { type: string }
                file: { type: string, format: binary }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Validation' }

  /applications:
    post:
      operationId: createApplication
      summary: Create funding application (DRAFT)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '422': { $ref: '#/components/responses/Validation' }
    get:
      operationId: listMyApplications
      summary: List my applications
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationPage' } } } }

  /applications/{id}:
    get:
      operationId: getApplication
      summary: Get one application (ownership enforced in repository scope — ST-2.3)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /applications/{id}/submit:
    post:
      operationId: submitApplication
      summary: Submit (state machine guard BR-S04; enqueues notification BR-N01)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /applications/{id}/resubmit:
    post:
      operationId: resubmitApplication
      summary: Resubmit after RETURNED_FOR_INFO (cycle tracked — BR-E04; 3 cycles → human outreach)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Re-queued for pre-screening, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /applications/{id}/appeal:
    post:
      operationId: appealDecision
      summary: One appeal per decision, with new information; reviewed by a different human (BR-E07)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_information]
              properties:
                new_information: { type: string, minLength: 20 }
      responses:
        '201': { description: Appeal registered, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /matches/run:
    post:
      operationId: runMatching
      summary: Run AI matching — synchronous advisory in v1 (spend-guarded; async queue deferred to v1.x, TAD §6.2)
      description: >-
        Scores the open, non-expired bursaries for the caller and returns the refreshed match page
        directly. Idempotent — a re-run converges via uq_match (ON CONFLICT refresh), never
        duplicates. (v1 runs in-request; the queued 202 worker pattern is deferred to v1.x.)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MatchPage' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /matches/me:
    get:
      operationId: getMyMatches
      summary: My match results (advisory; includes mode LIVE|FALLBACK — S8.51)
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MatchPage' } } } }

  /bursaries:
    get:
      operationId: browseBursaries
      security: []
      summary: Browse ALL bursaries (equal-prominence path — MASTER-SPEC §17.2)
      description: >-
        PUBLIC — no account required (L4 ruling, 2026-09-12). §17.2 makes browse-all the
        equal-prominence path and marketing-site.md §1 puts it in front of visitors who have
        not signed up: someone deciding whether to trust this platform with an ID number must
        be able to see what it funds first. Nothing in the response is personal data; the
        catalogue table carries no RLS.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: level, in: query, schema: { type: string } }
        - { name: field, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BursaryPage' } } } }

  /tracked-applications:
    post:
      operationId: registerTracked
      summary: Register an external application I made (BR-T01)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackedInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Tracked' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      operationId: listTracked
      summary: My dashboard — all tracked applications with status source labels
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TrackedPage' } } } }

  /tracked-applications/{id}/status:
    post:
      operationId: selfReportStatus
      summary: Self-report a status change (source=SELF_REPORT — BR-T03/T04)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_status]
              properties:
                to_status: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Tracked' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/applications:
    get:
      operationId: adminListApplications
      summary: Review queue (ADMIN_REVIEWER — S3.21 deny-by-default)
      description: >-
        Ordered for triage, not by arrival (D-002 / D-013): highest priority first
        (CRITICAL, URGENT, NORMAL), then the soonest review due date, then the soonest
        `needed_by`, then the application that has waited longest. The review due date is
        derived from `review_sla_days`, or `emergency_review_sla_days` for URGENT and
        CRITICAL, both read from the config table — never a literal in code. The cursor is
        opaque and encodes the whole sort key.

        Without `status`, this returns the review queue: every application whose next transition
        is a person's — READY_FOR_REVIEW, UNSCREENED (the pre-screen engine was unavailable, so a
        person reviews without it — S8.51), UNDER_REVIEW, INTERVIEW_SCHEDULED, INTERVIEWED,
        APPROVED_PROPOSED and APPEALED (BR-E07). Drafts, applications waiting on the student and
        decided applications are not in it. `status` narrows the queue to a single status.
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/applications/{id}:
    get:
      operationId: adminGetApplication
      summary: One application, for review (ADMIN_REVIEWER — S3.21 deny-by-default)
      description: >-
        The reviewer's read of a single application (A02). The student endpoint
        `getApplication` is ownership-scoped (ST-2.3) and requires APPLICATION_READ_OWN, which a
        reviewer does not hold — so A02 had been calling an endpoint that returns 403 to exactly
        the people who use it, and had only ever rendered against dev preview fixtures. This is
        the reviewer's own door: APPLICATION_REVIEW, reviewer-scoped RLS, and the student's
        motivation always included, because a reviewer reads the applicant's own words first.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/applications/{id}/recusal:
    post:
      operationId: adminRecuse
      summary: Step aside from an application because of a conflict of interest (BR-E09 · E8)
      description: >-
        A reviewer who personally knows an applicant must not review them. Recording a recusal
        is append-only and audit-logged. From then on the application leaves this reviewer's
        queue (and stays in everyone else's), and this reviewer's review and priority actions on
        it are refused with `reviewer_recused`. A second recusal by the same reviewer is 409.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [application_id, created_at]
                properties:
                  application_id: { type: string }
                  created_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Validation' }

  /admin/applications/{id}/review:
    post:
      operationId: adminReview
      summary: Record review outcome (audit-logged; APPROVED requires second authorizer at v2 — BR-S05)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [UNDER_REVIEW, INTERVIEW_SCHEDULED, APPROVED_PROPOSED, REJECTED] }
                note: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/applications/{id}/priority:
    post:
      operationId: adminSetPriority
      summary: >-
        Set triage priority — only ADMIN_REVIEWER+ may raise URGENT/CRITICAL (anti-gaming);
        students request urgency via needed_by + motivation (D-002/D-013). Audit-logged.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: { type: string, enum: [NORMAL, URGENT, CRITICAL] }
                note: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Application' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/me:
    get:
      operationId: listMyNotifications
      summary: My notification history
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }

  /notifications/preferences:
    get:
      operationId: getPreferences
      summary: My saved channel preferences, per trigger (BR-N02)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
    put:
      operationId: putPreferences
      summary: Update channel preferences (SMS upgrades per trigger — MASTER-SPEC §18.1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /students/me/data-export:
    get:
      operationId: dataExport
      summary: POPIA subject-rights export (MASTER-SPEC §15.6)
      responses:
        '200':
          description: Export bundle
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /students/me/activity:
    get:
      operationId: listMyActivity
      summary: My account activity — one timeline of everything recorded about my account
      description: >-
        Newest first, cursor-paged. Merges the caller's own audit trail (sign-ins, password and
        MFA changes, profile, documents, preferences, data exports), every status change on their
        applications and every change on their bursary trackers. `actor` says whether the student
        did it (YOU) or FundsLink did (FUNDSLINK) — a reviewer's identity is never disclosed, and
        neither audit `detail` nor status-event notes are ever returned. Which audit actions are
        shown is a server-side allowlist; routine token refreshes are not. `category` narrows
        the timeline to one heading, filtered in the query so every page is a full page.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: category, in: query, schema: { type: string, enum: [SECURITY, ACCOUNT, PRIVACY, DOCUMENTS, APPLICATION, MATCHING, TRACKING] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } } }
        '422': { $ref: '#/components/responses/Validation' }

  /students/me/overview:
    get:
      operationId: getMyOverview
      summary: My dashboard figures — every number read from the database at request time
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StudentOverview' } } } }

  /admin/overview:
    get:
      operationId: adminGetOverview
      summary: Operations overview for staff (APPLICATION_REVIEW — S3.21 deny-by-default)
      description: >-
        Live figures for the people running the review: the queue by status, how much of it is
        overdue against the config SLA (D-002), emergencies, applications reviewed without a
        pre-screen (S8.51), throughput and median time to decision over the chosen window,
        notification delivery health and account security events. `days` is the reporting window
        the viewer chooses; it is not a business rule.
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 7 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOverview' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }

  /admin/activity:
    get:
      operationId: adminListActivity
      summary: Recent system activity from the audit log (APPLICATION_REVIEW — S3.21)
      description: >-
        Newest first, cursor-paged. Action, resource and the KIND of actor (STUDENT, STAFF,
        SYSTEM, ANONYMOUS) with time. Audit `detail` is never returned — it can hold an email
        address — and actors are not named.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminActivityPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }

  responses:
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden:    { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound:     { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict:     { description: Business-rule conflict (stable error.code), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Validation:   { description: Validation failure, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited:  { description: Rate limited (Retry-After set), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooLarge:     { description: Payload too large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }

    RegisterRequest:
      type: object
      required: [email, password, consents]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        consents:
          type: array
          items:
            type: object
            required: [purpose, wording_version]
            properties:
              # The authoritative set is seeded in
              # alembic/versions/sql/0002_seeds.sql (lk_consent_purpose) and the
              # API rejects anything else with invalid_consent_purpose. Typed as
              # a bare string, the generated client could not catch a wrong
              # value, and the register screen shipped one — no student could
              # create an account (#254). The enum makes that a compile error.
              purpose:
                type: string
                enum:
                  - TERMS_OF_SERVICE
                  - PRIVACY_POLICY
                  - DATA_PROCESSING
                  - AI_MATCHING
                  - MARKETING_EMAIL
                  - MARKETING_SMS
              wording_version: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        mfa_code: { type: string, description: Required for privileged roles }

    AuthTokens:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer }

    MfaEnrollResponse:
      type: object
      required: [secret, provisioning_uri, recovery_codes]
      properties:
        secret: { type: string, description: Base32 TOTP secret (shown once) }
        provisioning_uri: { type: string, description: otpauth:// URI for the QR code }
        recovery_codes: { type: array, items: { type: string }, description: Single-use backup codes (shown once) }

    MfaStatus:
      type: object
      required: [enrolled, enabled, recovery_codes_remaining, required_for_role]
      properties:
        enrolled: { type: boolean, description: A TOTP secret exists (enrolment started) }
        enabled: { type: boolean, description: Two-step sign-in is on }
        recovery_codes_remaining: { type: integer, minimum: 0 }
        required_for_role: { type: boolean, description: This role must keep MFA on (TAD §3.1) }

    MfaSensitiveRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string }
        code: { type: string, description: An authenticator code, or one recovery code }

    MfaRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, items: { type: string } }

    MfaActivateRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: A current 6-digit TOTP from the authenticator }

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 10 }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 10 }

    StudentProfileInput:
      type: object
      required: [first_name, last_name, level, field_of_study]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string, description: TEXT — leading-zero rule DB-D17 }
        level: { type: string, enum: [UG, HONOURS, MASTERS, PHD, PGDIP] }
        field_of_study: { type: string }
        id_number: { type: string, description: Encrypted at rest; blind-indexed for uniqueness }
        hardship_narrative: { type: string }

    StudentProfile:
      allOf:
        - $ref: '#/components/schemas/StudentProfileInput'
        - type: object
          required: [id, verification_level, created_at]
          properties:
            id: { type: string }
            verification_level: { type: string, enum: [BRONZE, SILVER, GOLD, PLATINUM] }
            created_at: { type: string, format: date-time }

    Document:
      type: object
      required: [id, doc_type, av_status, created_at]
      properties:
        id: { type: string }
        doc_type: { type: string }
        application_id: { type: string }
        av_status: { type: string }
        created_at: { type: string, format: date-time }

    ApplicationInput:
      type: object
      required: [application_type, academic_year]
      properties:
        application_type: { type: string, enum: [POSTGRAD, UG_CAT_A, UG_CAT_B, UG_CAT_C, OTHER] }
        academic_year: { type: string }
        requested_amount: { type: string, description: Decimal string ZAR — never float (DB-D29) }
        household_income_band:
          type: string
          enum: [SASSA_GRANT, LTE_350K, MISSING_MIDDLE_350_600K, GT_600K, PREFER_NOT_TO_SAY]
          description: >-
            Self-declared household income band (D-016/D-017). NOT a means-test — the engine only
            annotates the band; a human verifies and decides (§5.7). Bands mirror the national
            NSFAS line (≤R350k) and missing-middle ceiling (R350k–R600k).
        nsfas_decline_reason:
          type: string
          enum: [MEANS_INCOME, DOCUMENTATION, ADMINISTRATIVE, ACADEMIC_NPLUS, OTHER]
          description: >-
            Reason read off the required NSFAS outcome letter for UG_CAT_C — replaces §5.4's
            ambiguous "various reasons" (D-016). MEANS_INCOME → human declines with a kind NSFAS /
            missing-middle redirect; documentation/administrative → genuine crack → eligible.
        prior_funder:
          type: string
          enum: [NSFAS, OTHER_BURSARY, SELF, NONE]
          description: >-
            Who funded the student before (D-016). OTHER_BURSARY + still NSFAS-eligible → reviewer
            redirects to NSFAS first.
        defunded_by:
          type: string
          description: Free-text — which funder dropped the student, if any (D-016).
        needed_by:
          type: string
          format: date
          description: >-
            "I need help by" — the student's urgency *request* (D-002/D-013). It does not set
            priority (that is ADMIN_REVIEWER+ only, anti-gaming); it informs the reviewer.
        motivation:
          type: object
          description: REQUIRED when application_type=OTHER (MASTER-SPEC §5.6, BR-E05)
          properties:
            situation: { type: string }
            why_not_categories: { type: string }
            support_needed: { type: string }
            language: { type: string, default: en, description: Any SA official language — E11 }

    Application:
      allOf:
        - $ref: '#/components/schemas/ApplicationInput'
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string }
            status: { type: string }
            priority: { type: string, enum: [NORMAL, URGENT, CRITICAL], description: Triage rank (D-002/D-013) }
            currency: { type: string, const: ZAR }
            pre_screen:
              type: object
              description: Latest pre-screen report (MASTER-SPEC §5.7) — annotations, never judgments
              properties:
                outcome: { type: string, enum: [READY, RETURNED, UNSCREENED] }
                fix_list: { type: array, items: { type: string } }
                annotations:
                  type: array
                  items: { type: string }
                  description: >-
                    Advisory review flags for the human (D-016/D-017) — e.g. income above the
                    postgrad ceiling, NSFAS-declined-for-income, still-NSFAS-eligible redirect.
                    Never an auto-decision (§5.7, D-010).
                cycle_no: { type: integer }
            decision_reason:
              type: string
              description: >-
                The reviewer's own words, carried back to the student (MASTER-SPEC §5.8, L4
                ruling 2026-09-12 closing #220). This is the `note` from adminReview — the same
                text A03 enforces at ≥40 words with a confirmed next step — and it is the
                SUBSTANCE of a decision, not a courtesy. Without it S16-REJ is a bare status
                change, which is the exact experience the design exists to prevent. Never
                auto-generated. Present once a decision has been recorded.
            decided_at:
              type: string
              format: date-time
              description: When the decision was recorded, so the screen can say it plainly.
            review_due_at:
              type: string
              format: date-time
              description: >-
                When FundsLink owes this application a review (D-002 / D-013). Starts when the
                application last came into FundsLink's hands — SUBMITTED, RESUBMITTED or APPEALED
                — and adds `review_sla_days`, or `emergency_review_sla_days` for URGENT and
                CRITICAL, from the config table. Present only while the application is waiting
                on FundsLink; absent while it is a draft, waiting on the student
                (RETURNED_FOR_INFO), or decided.
            recused_by_me:
              type: boolean
              description: >-
                Reviewer reads only (adminGetApplication): true when the caller has stepped aside
                from this application (BR-E09), so the screen can withhold the decision and
                priority actions. Never present on a student's read.
            sla_breached:
              type: boolean
              description: >-
                True when `review_due_at` has passed and the application is still waiting on
                FundsLink. Lets a reviewer see an overdue application without doing date
                arithmetic, and lets a student be told honestly that a review is late.
            waitlist_position:
              type: integer
              minimum: 1
              description: >-
                Position on the waitlist, 1-based, only on APPROVED_WAITLISTED (E4). Derived
                from the order in which applications were waitlisted. There is deliberately NO
                pool-size field: how many students the pool can fund depends on money this
                system does not yet hold or track, and S16-WAIT tells the truth it has rather
                than inventing a denominator.
            created_at: { type: string, format: date-time }

    Match:
      type: object
      required: [id, bursary, score, mode, created_at]
      properties:
        id: { type: string }
        bursary: { $ref: '#/components/schemas/Bursary' }
        score: { type: number, minimum: 0, maximum: 1 }
        mode: { type: string, enum: [LIVE, FALLBACK] }
        reasoning_summary: { type: string }
        created_at: { type: string, format: date-time }

    Bursary:
      type: object
      required: [id, name, provider, status]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        status: { type: string }
        level_eligibility: { type: array, items: { type: string } }
        field_tags: { type: array, items: { type: string } }
        next_deadline: { type: string, format: date }
        source_url: { type: string }

    TrackedInput:
      type: object
      required: [external_bursary_id]
      properties:
        external_bursary_id: { type: string }
        applied_on: { type: string, format: date }

    Tracked:
      type: object
      required: [id, bursary, status, status_source, last_activity_at]
      properties:
        id: { type: string }
        bursary: { $ref: '#/components/schemas/Bursary' }
        status: { type: string }
        status_source: { type: string, enum: [SELF_REPORT, EMAIL_CAPTURE, PARTNER_API], description: Freshness label — MASTER-SPEC §12.4 }
        last_activity_at: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, trigger, channels, state, created_at]
      properties:
        id: { type: string }
        trigger: { type: string }
        channels: { type: array, items: { type: string } }
        state: { type: string }
        created_at: { type: string, format: date-time }

    Preferences:
      type: object
      properties:
        per_trigger:
          type: object
          additionalProperties:
            type: array
            items: { type: string, enum: [EMAIL, SMS, IN_APP] }

    PageMeta:
      type: object
      properties:
        next_cursor: { type: [string, "null"] }

    ApplicationPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Application' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    MatchPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Match' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    BursaryPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Bursary' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    TrackedPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tracked' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    NotificationPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    ActivityItem:
      type: object
      required: [id, occurred_at, category, event, actor]
      properties:
        id: { type: string }
        occurred_at: { type: string, format: date-time }
        category: { type: string, enum: [SECURITY, ACCOUNT, PRIVACY, DOCUMENTS, APPLICATION, MATCHING, TRACKING] }
        event:
          type: string
          description: >-
            An audit action code (e.g. AUTH_LOGIN_SUCCESS), or APPLICATION_STATUS_CHANGED /
            TRACKER_STATUS_CHANGED for a status change, whose new status is `to_status`.
        actor: { type: string, enum: [YOU, FUNDSLINK] }
        resource_id: { type: [string, "null"] }
        to_status: { type: [string, "null"] }
        label: { type: [string, "null"], description: "The bursary name, for tracker events" }
    ActivityPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }

    StudentOverview:
      type: object
      required: [generated_at, applications, tracking, matches, notifications, account]
      properties:
        generated_at: { type: string, format: date-time }
        applications:
          type: object
          required: [total, drafts, needs_your_action, with_fundslink, decided, by_status]
          properties:
            total: { type: integer }
            drafts: { type: integer }
            needs_your_action: { type: integer, description: "RETURNED_FOR_INFO — the clock is the student's" }
            with_fundslink: { type: integer, description: "Waiting on FundsLink (the status list the review SLA uses)" }
            decided: { type: integer }
            by_status: { type: array, items: { $ref: '#/components/schemas/StatusCount' } }
        tracking:
          type: object
          required: [total, active, by_status, next_deadline]
          properties:
            total: { type: integer }
            active: { type: integer }
            by_status: { type: array, items: { $ref: '#/components/schemas/StatusCount' } }
            next_deadline: { oneOf: [ { $ref: '#/components/schemas/TrackedDeadline' }, { type: "null" } ] }
        matches:
          type: object
          required: [total, last_run_at]
          properties:
            total: { type: integer }
            last_run_at: { type: [string, "null"], format: date-time }
        notifications:
          type: object
          required: [total, last_at]
          properties:
            total: { type: integer }
            last_at: { type: [string, "null"], format: date-time }
        account:
          type: object
          required: [member_since, previous_sign_in_at, mfa_enabled]
          properties:
            member_since: { type: string, format: date-time }
            previous_sign_in_at:
              type: [string, "null"]
              format: date-time
              description: "The sign-in before the latest one — so a student can spot one that was not theirs"
            mfa_enabled: { type: boolean }
    TrackedDeadline:
      type: object
      required: [tracked_application_id, bursary_name, due_on, deadline_type]
      properties:
        tracked_application_id: { type: string }
        bursary_name: { type: string }
        due_on: { type: string, format: date }
        deadline_type: { type: string }

    AdminOverview:
      type: object
      required: [generated_at, window_days, queue, flow, notifications, accounts]
      properties:
        generated_at: { type: string, format: date-time }
        window_days: { type: integer }
        queue:
          type: object
          required: [awaiting_review, overdue, emergency, unscreened, awaiting_student, by_status]
          properties:
            awaiting_review: { type: integer, description: "Every application whose next step is a person's" }
            overdue: { type: integer, description: "Past the config review SLA (D-002)" }
            emergency: { type: integer, description: "URGENT or CRITICAL priority, awaiting review" }
            unscreened: { type: integer, description: "Waiting without a pre-screen (S8.51)" }
            awaiting_student: { type: integer, description: "RETURNED_FOR_INFO" }
            by_status: { type: array, items: { $ref: '#/components/schemas/StatusCount' } }
        flow:
          type: object
          required: [submitted, approved, waitlisted, not_funded, median_days_to_decision]
          properties:
            submitted: { type: integer }
            approved: { type: integer }
            waitlisted: { type: integer }
            not_funded: { type: integer }
            median_days_to_decision: { type: [number, "null"] }
        notifications:
          type: object
          required: [pending, failed, sent]
          properties:
            pending: { type: integer }
            failed: { type: integer, description: "Gave up after retries (DEAD)" }
            sent: { type: integer, description: "Sent in the window" }
        accounts:
          type: object
          required: [registered, sign_ins, failed_sign_ins, locked]
          properties:
            registered: { type: integer }
            sign_ins: { type: integer }
            failed_sign_ins: { type: integer }
            locked: { type: integer, description: "Account lockouts after repeated failed sign-ins" }

    AdminActivityItem:
      type: object
      required: [id, occurred_at, action, resource_type, actor_kind]
      properties:
        id: { type: string }
        occurred_at: { type: string, format: date-time }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, "null"] }
        actor_kind: { type: string, enum: [STUDENT, STAFF, SYSTEM, ANONYMOUS] }
    AdminActivityPage:
      type: object
      required: [items, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminActivityItem' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
