<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <title>FundsLink Academy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Must equal ORGANISATION.positioning (content/organisation.ts) — crawlers and link previews
       read this static tag without running the app, so a runtime Meta update alone is not enough.
       A test pins the two together. -->
  <meta name="description" content="Bursary funding for South African students whose studies are not fully covered.">

  <!-- Brand mark. SVG scales to every icon slot from one 684-byte file; the .ico
       remains for legacy Windows/Explorer contexts that ignore SVG favicons. -->
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="logo-mark.svg">

  <!-- Paints the browser chrome to match the theme, in both schemes. -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">

  <!-- IBM Plex Sans — one family, hierarchy by weight (design-system.md §3).
       Self-hosted (see styles/fonts.css): same-origin, so no DNS + TLS handshake
       stands between the document and readable text on 3G, and no third party
       learns who is reading a bursary application.

       Only 400 (body) and 600 (headings) are preloaded — they are on the
       critical path for every first paint. 500 is used for UI labels further
       down the page and is left to load normally. `crossorigin` is required on
       font preloads even same-origin, or the browser fetches the file twice. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="fonts/ibm-plex-sans-latin-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="fonts/ibm-plex-sans-latin-600-normal.woff2">

  <!-- Theme, resolved before first paint.
       Without this a dark-mode user sees a white flash while Angular boots —
       the one moment a "premium" product looks broken. Kept deliberately tiny
       and dependency-free; it must stay in sync with ThemeService
       (THEME_STORAGE_KEY = 'fl-theme'), and a unit test pins that agreement.
       NOTE (Stage 04/06): when the strict CSP header lands (ST-2.4), this
       inline script needs its sha256 hash in `script-src`. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('fl-theme');
        var dark =
          stored === 'dark' ||
          ((stored === null || stored === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {
        /* Blocked storage: fall through to the light default. Never block paint. */
      }
    })();
  </script>

  <!-- Hero image preload — HOME ONLY.
       The hero photograph is rendered by a lazy route, so without this its request cannot start
       until Angular has booted and rendered the page: it downloads last, and LCP (the photo) waited
       on it — measured at ~3.7-4.0 s against ~2.9-3.2 s before the image existed. Preloading lets it
       download in parallel with the JavaScript.
       But this document serves EVERY route, and a plain <link rel="preload"> would make a student
       opening /app pay for marketing imagery on their data (P6). So the preload is injected only
       for "/". `type="image/avif"` makes a browser without AVIF skip it (the <picture> then falls
       back to WebP normally), and the media/srcset/sizes must equal the <picture> sources exactly
       or the browser downloads twice — a test pins that agreement.
       NOTE (ST-2.4): like the theme script above, this needs its sha256 in `script-src`. -->
  <script>
    (function () {
      if (location.pathname !== '/') return;
      var hero = [
        ['(max-width: 767px)', 'images/hero/hero-mobile-640.avif 640w, images/hero/hero-mobile-1024.avif 1024w'],
        ['(min-width: 768px)', 'images/hero/hero-desktop-960.avif 960w, images/hero/hero-desktop-1536.avif 1536w']
      ];
      for (var i = 0; i < hero.length; i++) {
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.type = 'image/avif';
        link.media = hero[i][0];
        link.setAttribute('imagesrcset', hero[i][1]);
        link.setAttribute('imagesizes', '100vw');
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
