# Alembic config — FundsLink Academy (Stage 01).
# The DB URL is resolved at runtime in alembic/env.py from the environment
# (ALEMBIC_DATABASE_URL > DATABASE_URL > settings); it is intentionally NOT set here (S3.20).
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Migration filenames: NNNN_slug (zero-padded ordinal), matching 0001_/0002_.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
