[project]
name = "fundslink-api"
version = "0.1.0"
description = "FundsLink Academy — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

# Layering enforcement (CLAUDE.md hard rule): router -> service -> repository.
# ONLY repositories may import DB drivers. Routers and services may not.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Routers and services must not import DB drivers (only repositories may)"
type = "forbidden"
source_modules = [
    "app.modules.*.router",
    "app.modules.*.service",
]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
]
