[project]
name = "fundslink-api"
version = "0.1.0"
description = "FundsLink Academy — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database (Stage 01) — async runtime via asyncpg; migrations via sync psycopg3 (ADR-003).
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # Observability (S3.34 / S8.11) — error tracking; no-op without SENTRY_DSN.
    "sentry-sdk[fastapi]>=2.0",
    # Auth core (C3 Part 2) — RS256 JWT, bcrypt hashing, Redis deny-list/rate-limit,
    # HIBP k-anonymity over httpx, TOTP MFA.
    "pyjwt[crypto]>=2.8",
    "bcrypt>=4.1",
    "redis>=5.0",
    "httpx>=0.27",
    "pyotp>=2.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "import-linter>=2.0",
    "fakeredis>=2.21",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's dependency-injection idiom puts Depends()/Header()/etc. in argument defaults; these
# are the framework's sanctioned callables, so they are exempt from flake8-bugbear B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path",
    "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

# Layering enforcement (CLAUDE.md hard rule): router -> service -> repository.
# ONLY repositories may import DB drivers. Routers and services may not.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Routers and services must not import DB drivers (only repositories may)"
type = "forbidden"
source_modules = [
    "app.modules.*.router",
    "app.modules.*.service",
]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
]
# DIRECT imports only. The rule's intent (its name) is that a router/service file never
# imports a DB driver itself — it must go through a repository. The canonical layering
# router -> service -> repository -> DB is therefore an *indirect* chain that is expected and
# allowed; without this, a service that uses any repository would falsely break the contract.
# A direct `import sqlalchemy` in a router/service is still caught. (Stage 02, first service.)
allow_indirect_imports = "true"
