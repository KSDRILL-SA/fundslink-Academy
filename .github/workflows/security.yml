name: security

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (free CLI — the org-licensed Action is not used)
        run: |
          GL=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan (S3.20 / CF-04)
        run: gitleaks detect --redact --no-banner

  # Stage 05 item 3 — dependency audit. Both ecosystems, on every push, because
  # a dependency audit that runs when someone remembers to run it is not a gate.
  # It found one high advisory the first time it was run by hand (#257).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --audit-level=high: a moderate advisory in a build-time devDependency
      # should not block a fix a student is waiting for. High and critical do.
      - name: npm audit — apps/web
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: npm audit — packages/contracts
        working-directory: packages/contracts
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      # Audit the LOCKFILE, exported, rather than an installed environment.
      # The first version of this job ran pip-audit against the runner's system
      # Python while a project venv was loaded, and pip-audit said so:
      #   "will run pip against /opt/hostedtoolcache/... but you have a virtual
      #    environment loaded ... your local environment will not be audited"
      # It reported "No known vulnerabilities found" without ever looking at our
      # dependencies — a green check that proved nothing, which is worse than no
      # check at all. Exporting uv.lock removes the ambiguity: there is no
      # interpreter to guess at, and uv.lock is what we actually ship (S1.98).
      - name: pip-audit — apps/api (uv.lock)
        working-directory: apps/api
        run: |
          python -m pip install pip-audit
          python -m uv export --frozen --no-emit-project -o requirements.audit.txt
          wc -l requirements.audit.txt
          python -m pip_audit -r requirements.audit.txt --progress-spinner off
