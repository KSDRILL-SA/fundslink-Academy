name: api

on:
  push:
    paths:
      - "apps/api/**"
      # The contract-diff gate (S2.7) compares FastAPI's schema against this spec, and the gate
      # scripts themselves live in scripts/ — a change to either MUST re-run this workflow, else
      # spec drift or a weakened gate slips through unchecked.
      - "packages/contracts/**"
      - "scripts/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contracts/**"
      - "scripts/**"
      - ".github/workflows/api.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # PostgreSQL 16 service — the database gate (Stage 01) runs against a real PG,
    # mirroring the local throwaway cluster used during the build.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fundslink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fundslink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fundslink
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fundslink
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (reproducible, locked deps)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv sync --frozen installs the EXACT versions pinned in uv.lock (Python 3.12 via
      # apps/api/.python-version); it fails if the lock and pyproject have drifted, so the build
      # can never silently pick up a different dependency tree than the one that was reviewed.
      - name: Install (frozen — exact deps from uv.lock)
        run: uv sync --frozen --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Layering (import-linter — routers/services may not import DB drivers)
        run: uv run lint-imports
      - name: Permission lint (S3.21 — deny-by-default; every route declares its posture)
        run: uv run python ../../scripts/permission_lint.py
      - name: Contract diff (S2.7 — FastAPI OpenAPI vs packages/contracts/openapi.yaml)
        run: uv run python ../../scripts/contract_diff.py
      - name: Store-isolation lint (S5.3 — no money outside PostgreSQL; Redis key allowlist)
        run: uv run python ../../scripts/store_isolation_lint.py
      - name: Migrations — upgrade from zero (DB-D36)
        run: uv run alembic upgrade head
      - name: Migrations — downgrade→upgrade roundtrip clean
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Partition maintenance (DB-D44 — keep N+12 ahead)
        run: uv run python -m app.db.partitions
      - name: Integrity job (DB-D39 — clean on seeded DB)
        run: uv run python -m app.db.integrity
      - name: Test (pytest — incl. DB-D37 constraint suite when present)
        run: uv run pytest -q
