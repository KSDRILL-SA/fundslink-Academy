name: api

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # PostgreSQL 16 service — the database gate (Stage 01) runs against a real PG,
    # mirroring the local throwaway cluster used during the build.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fundslink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fundslink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fundslink
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fundslink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Layering (import-linter — routers/services may not import DB drivers)
        run: lint-imports
      - name: Permission lint (placeholder — S3.21)
        run: echo "TODO S3.21 deny-by-default permission lint — activates when endpoints exist"
      - name: Contract diff (placeholder — S2.7)
        run: echo "TODO S2.7 FastAPI OpenAPI vs packages/contracts yaml — activates when endpoints exist"
      - name: Migrations — upgrade from zero (DB-D36)
        run: alembic upgrade head
      - name: Migrations — downgrade→upgrade roundtrip clean
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Test (pytest — incl. DB-D37 constraint suite when present)
        run: pytest -q
